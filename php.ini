; Per-directory PHP settings - updated for PHP 8.5.
;
; This file is only read when the host runs PHP as CGI/suPHP and honours a
; php.ini in the site folder. Hosts running PHP-FPM or LiteSpeed (most cPanel
; servers) ignore it - set these values in the control panel instead
; (cPanel > MultiPHP INI Editor, or Select PHP Version > Options).
;
; Removed for PHP 8.5:
;   register_globals = off   - feature removed in PHP 5.4; the setting does nothing
;   extension_dir = ./       - pointed PHP's extension folder at the website folder,
;                              which breaks extension loading if this file is used
;   Zend Optimizer block     - Zend Optimizer does not exist for PHP 5.3 or newer

allow_url_fopen = Off
expose_php = Off
max_input_time = 60
variables_order = "EGPCS"
upload_tmp_dir = /tmp
precision = 12
SMTP = relay-hosting.secureserver.net
url_rewriter.tags = "a=href,area=href,frame=src,input=src,form=,fieldset="


; -- Be very careful to not to disable a function which might be needed!
; -- Uncomment the following lines to increase the security of your PHP site.

;disable_functions = "highlight_file,ini_alter,ini_restore,openlog,passthru,
;		      phpinfo, exec, system, dl, fsockopen, set_time_limit,
;                     popen, proc_open, proc_nice,shell_exec,show_source,symlink"
